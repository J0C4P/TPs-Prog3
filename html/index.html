<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deportes Unca</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="estilos.css">
  <script src="../actividades.js"></script>
</head>
<body class="container">
  <header class="container">
      <h1>Deportes Unca</h1>
      <h2>Plataforma de actividades deportivas</h2>
      <hr>
      <nav>
          <ul>
              <li><a href="#">Inicio</a></li>
              <li><a href="#">Registrarse</a></li>
              <li><a href="#">Actividades deportivas</a></li>
              <li><a href="formulario.html">Inscribirse a una actividad</a></li>
          </ul>
      </nav>
      <nav>
          <a href="inscripciones.html">Mis inscripciones</a> |
          <a href="#">Cancelar inscripción</a> |
          <a href="#">Iniciar sesión</a>
      </nav>
      <hr>
  </header>
  <table id="tabla-actividades">
    <thead>
      <tr>
        <th>Actividad</th>
        <th>Lugar</th>
        <th>Día</th>
        <th>Horario</th>
        <th>Cupos</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody id="cuerpo-tabla"></tbody>
  </table>
  <hr>
  <footer>
    <a href="#">Ir al Inicio</a>
    <p>Deportes Unca – 2026</p>
  </footer>

  <script>
    const actividades = sistemaDeportes.listarActividades();
    const tabla = document.getElementById('tabla-actividades');

    if (tabla){
      const cuerpoTabla = document.getElementById('cuerpo-tabla');
      actividades.forEach(actividad => {
        const fila = document.createElement('tr');
        
        const celdaNombre = document.createElement('td');
        celdaNombre.textContent = actividad.nombre;
        const celdaLugar = document.createElement("td");
        celdaLugar.textContent = actividad.lugar;
        const celdaDia = document.createElement("td");
        celdaDia.textContent = actividad.dia;
        const celdaHorario = document.createElement("td");
        celdaHorario.textContent = actividad.horario;
        const celdaCupo = document.createElement("td");
        celdaCupo.textContent = actividad.cupo;
        const celdaEstado = document.createElement("td");
        celdaEstado.textContent = actividad.estado;

        fila.append(celdaNombre, celdaLugar, celdaDia, celdaHorario, celdaCupo, celdaEstado);

        cuerpoTabla.appendChild(fila);
      });
    }
  </script>
</body>
</html>
